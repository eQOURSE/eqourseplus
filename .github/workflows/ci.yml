name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Database environment to verify
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: Database operation to run in the selected environment
        required: true
        type: choice
        default: status
        options:
          - status
          - apply
          - seed

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 284874841026
  ECR_REPOSITORY: eqplus-api

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore MongoDB memory-server binary cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: ${{ runner.os }}-mongodb-memory-server-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/node_modules/.cache/mongodb-memory-server

      - name: Lint
        run: pnpm lint

      - name: Test without external services
        run: pnpm test
        env:
          MONGOMS_RUNTIME_DOWNLOAD: "false"

      - name: Build
        run: pnpm build

  database-migrate:
    # FR-FND-07: run migrations in private ECS tasks; read the outcome from logs.
    name: Run ${{ inputs.environment }} ${{ inputs.environment == 'staging' && inputs.action == 'seed' && 'seed' || inputs.environment == 'staging' && 'apply' || inputs.action }} database operation
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Select environment-scoped database operation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.environment }}" == "staging" ]]; then
            if [[ "${{ inputs.action }}" == "seed" ]]; then
              MIGRATION_ACTION=seed
            else
              MIGRATION_ACTION=apply
            fi
          elif [[ "${{ inputs.environment }}" == "production" ]]; then
            MIGRATION_ACTION=${{ inputs.action }}
          else
            echo "::error::Unsupported database environment"
            exit 1
          fi
          echo "MIGRATION_ACTION=${MIGRATION_ACTION}" >> "${GITHUB_ENV}"
          echo "Selected ${{ inputs.environment }} migration action: ${MIGRATION_ACTION}"

      - name: Configure AWS migration credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::284874841026:role/eqplus-github-migrate-${{ inputs.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve migration image
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Migration image is missing or has an invalid digest"
            exit 1
          fi
          echo "MIGRATION_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${DIGEST}" >> "${GITHUB_ENV}"

      - name: Register migration task definition
        id: register-migration
        shell: bash
        run: |
          set -euo pipefail
          ENVIRONMENT="${{ inputs.environment }}"
          jq -n \
            --arg family "eqplus-migrate-${ENVIRONMENT}" \
            --arg executionRoleArn "arn:aws:iam::${AWS_ACCOUNT_ID}:role/eqplus-${ENVIRONMENT}-task-migrate-execution" \
            --arg image "${MIGRATION_IMAGE}" \
            --arg action "${MIGRATION_ACTION}" \
            --arg secret "arn:aws:ssm:${AWS_REGION}:${AWS_ACCOUNT_ID}:parameter/eqplus/${ENVIRONMENT}/MONGODB_URI_MIGRATOR" \
            --arg logGroup "/ecs/eqplus-${ENVIRONMENT}-migrate" \
            --arg region "${AWS_REGION}" \
            '{family:$family, requiresCompatibilities:["FARGATE"], networkMode:"awsvpc", cpu:"512", memory:"1024", executionRoleArn:$executionRoleArn, containerDefinitions:[{name:"migrate", image:$image, essential:true, command:["node","/app/scripts/run-migration.cjs"], environment:[{name:"NODE_ENV",value:"production"},{name:"MIGRATION_ACTION",value:$action}], secrets:[{name:"MONGODB_MIGRATION_URI",valueFrom:$secret}], logConfiguration:{logDriver:"awslogs",options:{"awslogs-group":$logGroup,"awslogs-region":$region,"awslogs-stream-prefix":"migrate"}}}]}' > task-definition.json
          TASK_DEFINITION_ARN="$(aws ecs register-task-definition --cli-input-json file://task-definition.json \
            --tags key=Project,value=eQOURSE+ key=Environment,value="${ENVIRONMENT}" key=SourceSha,value="${GITHUB_SHA}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "task_definition_arn=${TASK_DEFINITION_ARN}" >> "${GITHUB_OUTPUT}"

      - name: Run migration task
        id: run-migration
        shell: bash
        run: |
          set -euo pipefail
          ENVIRONMENT="${{ inputs.environment }}"
          if [[ "${ENVIRONMENT}" == "staging" ]]; then
            SECURITY_GROUP=sg-0abf6a84538fd858b
          else
            SECURITY_GROUP=sg-0bdab43c8e81b9785
          fi
          RUN_RESPONSE="$(aws ecs run-task --cluster "eqplus-${ENVIRONMENT}" --launch-type FARGATE --count 1 \
            --task-definition "${{ steps.register-migration.outputs.task_definition_arn }}" \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-08f064ed2f87d7663,subnet-02ee1d41c12e597dc],securityGroups=[${SECURITY_GROUP}],assignPublicIp=DISABLED}" \
            --output json)"
          if [[ "$(jq '.failures | length' <<< "${RUN_RESPONSE}")" -ne 0 ]]; then
            jq '.failures' <<< "${RUN_RESPONSE}"
            exit 1
          fi
          TASK_ARN="$(jq -r '.tasks[0].taskArn // empty' <<< "${RUN_RESPONSE}")"
          test -n "${TASK_ARN}"
          echo "task_arn=${TASK_ARN}" >> "${GITHUB_OUTPUT}"

      - name: Wait for migration task
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TASK_ARN="${{ steps.run-migration.outputs.task_arn }}"
          if [[ -n "${TASK_ARN}" ]]; then
            aws ecs wait tasks-stopped --cluster "eqplus-${{ inputs.environment }}" --tasks "${TASK_ARN}" || true
          fi

      - name: Print migration logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TASK_ARN="${{ steps.run-migration.outputs.task_arn }}"
          if [[ -n "${TASK_ARN}" ]]; then
            TASK_ID="${TASK_ARN##*/}"
            aws logs get-log-events --log-group-name "/ecs/eqplus-${{ inputs.environment }}-migrate" \
              --log-stream-name "migrate/migrate/${TASK_ID}" --start-from-head \
              --query 'events[].message' --output text || true
          fi

      - name: Validate migration result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TASK_ARN="${{ steps.run-migration.outputs.task_arn }}"
          if [[ -z "${TASK_ARN}" ]]; then
            echo "::error::Migration task did not start"
            exit 1
          fi
          TASK="$(aws ecs describe-tasks --cluster "eqplus-${{ inputs.environment }}" --tasks "${TASK_ARN}" --output json | jq '.tasks[0]')"
          STOP_CODE="$(jq -r '.stopCode // empty' <<< "${TASK}")"
          EXIT_CODE="$(jq -r '.containers[] | select(.name == "migrate") | .exitCode // empty' <<< "${TASK}")"
          if [[ "${STOP_CODE}" != "EssentialContainerExited" || "${EXIT_CODE}" != "0" ]]; then
            echo "::error::Migration task failed"
            jq -r '"stoppedReason: \(.stoppedReason // "")", (.containers[] | select(.name == "migrate") | "container reason: \(.reason // "")")' <<< "${TASK}"
            exit 1
          fi

  staging-deploy:
    # FR-FND-05: build once on develop, then promote this immutable image to prod.
    name: Build, push, and deploy staging API
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    env:
      CORS_ORIGINS: "http://localhost:3000,https://staging.plus.eqourse.com"
      SENTRY_ENVIRONMENT: "staging"
      MAILER_PROVIDER: "resend"
      OTP_EMAIL_FROM: ${{ vars.OTP_EMAIL_FROM }}
      SMS_PROVIDER: "sandbox"
      STORAGE_PROVIDER: "r2"
      R2_ENDPOINT: "https://50c49dfc680d966ef959aba266b04ea9.r2.cloudflarestorage.com"
      R2_BUCKET: "eqplus-staging-kyc-docs"
      NODE_ENV: "production"
      PORT: "8080"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate staging runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CORS_ORIGINS:-}" ]]; then
            echo "::error::Missing required runtime configuration: CORS_ORIGINS"
            exit 1
          fi
          if [[ -z "${OTP_EMAIL_FROM:-}" ]]; then
            echo "::error::Missing required runtime configuration: OTP_EMAIL_FROM"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS staging credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::284874841026:role/eqplus-github-deploy-staging
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image if absent
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "Source image already exists in ECR"
          else
            docker build --file apps/api/Dockerfile -t "${IMAGE_REPOSITORY}:${GITHUB_SHA}" .
            docker push "${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          fi

      - name: Resolve staging image digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Built image has no valid digest"
            exit 1
          fi
          echo "STAGED_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${DIGEST}" >> "${GITHUB_ENV}"

      - name: Deploy staging API
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition eqplus-api-staging --include TAGS --output json |
            jq --arg image "${STAGED_IMAGE}" \
              --arg CORS_ORIGINS "${CORS_ORIGINS}" --arg SENTRY_ENVIRONMENT "${SENTRY_ENVIRONMENT}" \
              --arg MAILER_PROVIDER "${MAILER_PROVIDER}" --arg OTP_EMAIL_FROM "${OTP_EMAIL_FROM}" \
              --arg SMS_PROVIDER "${SMS_PROVIDER}" --arg STORAGE_PROVIDER "${STORAGE_PROVIDER}" \
              --arg R2_ENDPOINT "${R2_ENDPOINT}" --arg R2_BUCKET "${R2_BUCKET}" \
              --arg NODE_ENV "${NODE_ENV}" --arg PORT "${PORT}" \
              '.taskDefinition | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) |
               if any(.containerDefinitions[]; .name == "api") then
                 .containerDefinitions |= map(if .name == "api" then .image = $image |
                   .environment = [{name:"CORS_ORIGINS",value:$CORS_ORIGINS},{name:"SENTRY_ENVIRONMENT",value:$SENTRY_ENVIRONMENT},{name:"MAILER_PROVIDER",value:$MAILER_PROVIDER},{name:"OTP_EMAIL_FROM",value:$OTP_EMAIL_FROM},{name:"SMS_PROVIDER",value:$SMS_PROVIDER},{name:"STORAGE_PROVIDER",value:$STORAGE_PROVIDER},{name:"R2_ENDPOINT",value:$R2_ENDPOINT},{name:"R2_BUCKET",value:$R2_BUCKET},{name:"NODE_ENV",value:$NODE_ENV},{name:"PORT",value:$PORT}]
                   else . end)
               else error("api container missing") end' > task-definition.json
          TASK_DEFINITION_ARN="$(aws ecs register-task-definition --cli-input-json file://task-definition.json \
            --tags key=Project,value=eQOURSE+ key=Environment,value=staging key=SourceSha,value="${GITHUB_SHA}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          aws ecs update-service --cluster eqplus-staging --service eqplus-api-staging --task-definition "${TASK_DEFINITION_ARN}"
          aws ecs wait services-stable --cluster eqplus-staging --services eqplus-api-staging
          PRIMARY="$(aws ecs describe-services --cluster eqplus-staging --services eqplus-api-staging --output json | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | [.rolloutState,.taskDefinition] | @tsv')"
          if [[ "${PRIMARY}" != COMPLETED$'\t'"${TASK_DEFINITION_ARN}" ]]; then
            echo "::error::Staging deployment did not complete on the new task definition"
            exit 1
          fi

      - name: Verify staging health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 https://api-staging.plus.eqourse.com/health

  production-deploy:
    name: Deploy production API
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CORS_ORIGINS: "https://plus.eqourse.com"
      SENTRY_ENVIRONMENT: "production"
      MAILER_PROVIDER: "resend"
      OTP_EMAIL_FROM: ${{ vars.OTP_EMAIL_FROM }}
      SMS_PROVIDER: "sandbox"
      STORAGE_PROVIDER: "r2"
      R2_ENDPOINT: "https://50c49dfc680d966ef959aba266b04ea9.r2.cloudflarestorage.com"
      R2_BUCKET: "eqplus-prod-kyc-docs"
      NODE_ENV: "production"
      PORT: "8080"
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Validate production runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CORS_ORIGINS:-}" ]]; then
            echo "::error::Missing required runtime configuration: CORS_ORIGINS"
            exit 1
          fi
          if [[ -z "${OTP_EMAIL_FROM:-}" ]]; then
            echo "::error::Missing required runtime configuration: OTP_EMAIL_FROM"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate staged develop commit
        shell: bash
        run: |
          set -euo pipefail
          PARENTS="$(git rev-list --parents -n 1 HEAD)"
          if [ "$(wc -w <<< "${PARENTS}")" -ne 3 ]; then
            echo "::error::Production requires a two-parent develop-to-main merge commit"
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD^2)"
          if [ "${SOURCE_SHA}" != "$(git rev-parse origin/develop)" ]; then
            echo "::error::Merge second parent is not the current develop tip"
            exit 1
          fi
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "${GITHUB_ENV}"

      - name: Verify source commit passed staging deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_IDS="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" -f branch=develop -f head_sha="${SOURCE_SHA}" -f event=push -f status=success --jq '.workflow_runs[].id')"
          VERIFIED=false
          for RUN_ID in ${RUN_IDS}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name == "Build, push, and deploy staging API" and .conclusion == "success") | .id' | grep -q .; then
              VERIFIED=true
              break
            fi
          done
          if [ "${VERIFIED}" != true ]; then
            echo "::error::No successful staging deployment found for ${SOURCE_SHA}"
            exit 1
          fi

      - name: Configure AWS production credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::284874841026:role/eqplus-github-deploy-production
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve exact staged image digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${SOURCE_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Staged image is missing or has an invalid digest"
            exit 1
          fi
          PROMOTED_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${DIGEST}"
          STAGING_TASK_DEFINITION="$(aws ecs describe-services --cluster eqplus-staging --services eqplus-api-staging --output json | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition')"
          STAGING_IMAGE="$(aws ecs describe-task-definition --task-definition "${STAGING_TASK_DEFINITION}" --output json | jq -r '.taskDefinition.containerDefinitions[] | select(.name == "api") | .image')"
          if [[ "${STAGING_IMAGE}" != "${PROMOTED_IMAGE}" ]]; then
            echo "::error::Staging is not running the image selected for promotion"
            exit 1
          fi
          echo "PROMOTED_IMAGE=${PROMOTED_IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy approved image to production
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition eqplus-api-production --include TAGS --output json |
            jq --arg image "${PROMOTED_IMAGE}" \
              --arg CORS_ORIGINS "${CORS_ORIGINS}" --arg SENTRY_ENVIRONMENT "${SENTRY_ENVIRONMENT}" \
              --arg MAILER_PROVIDER "${MAILER_PROVIDER}" --arg OTP_EMAIL_FROM "${OTP_EMAIL_FROM}" \
              --arg SMS_PROVIDER "${SMS_PROVIDER}" --arg STORAGE_PROVIDER "${STORAGE_PROVIDER}" \
              --arg R2_ENDPOINT "${R2_ENDPOINT}" --arg R2_BUCKET "${R2_BUCKET}" \
              --arg NODE_ENV "${NODE_ENV}" --arg PORT "${PORT}" \
              '.taskDefinition | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) |
               if any(.containerDefinitions[]; .name == "api") then
                 .containerDefinitions |= map(if .name == "api" then .image = $image |
                   .environment = [{name:"CORS_ORIGINS",value:$CORS_ORIGINS},{name:"SENTRY_ENVIRONMENT",value:$SENTRY_ENVIRONMENT},{name:"MAILER_PROVIDER",value:$MAILER_PROVIDER},{name:"OTP_EMAIL_FROM",value:$OTP_EMAIL_FROM},{name:"SMS_PROVIDER",value:$SMS_PROVIDER},{name:"STORAGE_PROVIDER",value:$STORAGE_PROVIDER},{name:"R2_ENDPOINT",value:$R2_ENDPOINT},{name:"R2_BUCKET",value:$R2_BUCKET},{name:"NODE_ENV",value:$NODE_ENV},{name:"PORT",value:$PORT}]
                   else . end)
               else error("api container missing") end' > task-definition.json
          TASK_DEFINITION_ARN="$(aws ecs register-task-definition --cli-input-json file://task-definition.json \
            --tags key=Project,value=eQOURSE+ key=Environment,value=production key=SourceSha,value="${SOURCE_SHA}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          aws ecs update-service --cluster eqplus-production --service eqplus-api-production --task-definition "${TASK_DEFINITION_ARN}"
          aws ecs wait services-stable --cluster eqplus-production --services eqplus-api-production
          PRIMARY="$(aws ecs describe-services --cluster eqplus-production --services eqplus-api-production --output json | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | [.rolloutState,.taskDefinition] | @tsv')"
          if [[ "${PRIMARY}" != COMPLETED$'\t'"${TASK_DEFINITION_ARN}" ]]; then
            echo "::error::Production deployment did not complete on the new task definition"
            exit 1
          fi

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 https://api.plus.eqourse.com/health

      - name: Tag production release
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(date -u +prod-%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${GITHUB_SHA}" -m "Production release ${TAG}; image source ${SOURCE_SHA}; image ${PROMOTED_IMAGE}"
          git push origin "refs/tags/${TAG}"
