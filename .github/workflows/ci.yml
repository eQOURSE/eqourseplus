name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Database environment to verify
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

env:
  PROJECT_ID: eqplus-503212
  REGION: asia-south1
  ARTIFACT_REPOSITORY: eqplus-api
  IMAGE_NAME: eqplus-api
  IMAGE_URI: asia-south1-docker.pkg.dev/eqplus-503212/eqplus-api/eqplus-api:${{ github.sha }}
  STAGING_RUNTIME_SERVICE_ACCOUNT: eqplus-api-staging-runtime@eqplus-503212.iam.gserviceaccount.com
  PRODUCTION_RUNTIME_SERVICE_ACCOUNT: eqplus-api-runtime@eqplus-503212.iam.gserviceaccount.com

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore MongoDB memory-server binary cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: ${{ runner.os }}-mongodb-memory-server-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/node_modules/.cache/mongodb-memory-server

      - name: Lint
        run: pnpm lint

      - name: Test without external services
        run: pnpm test
        env:
          MONGOMS_RUNTIME_DOWNLOAD: "false"

      - name: Build
        run: pnpm build

  database-migrate:
    # FR-FND-07: execute migrations inside Cloud Run so Atlas sees the approved
    # Cloud Run NAT address. The migration URI is injected by Secret Manager.
    name: Run ${{ inputs.environment }} database verification
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Select environment-scoped migration command
        shell: bash
        run: |
          if [[ "${{ inputs.environment }}" == "staging" ]]; then
            echo "MIGRATION_SECRET=MONGODB_URI_MIGRATOR_STAGING" >> "${GITHUB_ENV}"
            echo "MIGRATION_COMMAND=db:migrate" >> "${GITHUB_ENV}"
          elif [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "MIGRATION_SECRET=MONGODB_URI_MIGRATOR" >> "${GITHUB_ENV}"
            echo "MIGRATION_COMMAND=db:migrate:status" >> "${GITHUB_ENV}"
          else
            echo "::error::Unsupported migration environment"
            exit 1
          fi
          echo "Selected ${{ inputs.environment }} migration verification"

      - name: Verify the API image exists
        run: >-
          gcloud artifacts docker images describe "${IMAGE_URI}"
          --project="${PROJECT_ID}"
          --format='value(image_summary.digest)'

      - name: Deploy the one-shot migration Cloud Run Job
        run: >-
          gcloud run jobs deploy "eqplus-db-migrate-${{ inputs.environment }}"
          --project="${PROJECT_ID}"
          --region="${REGION}"
          --image="${IMAGE_URI}"
          --service-account="${{ vars.GCP_MIGRATION_SERVICE_ACCOUNT }}"
          --network=default
          --subnet=default
          --vpc-egress=all-traffic
          --max-retries=0
          --task-timeout=10m
          --set-env-vars=NODE_ENV=production
          --set-secrets="MONGODB_MIGRATION_URI=${MIGRATION_SECRET}:latest"
          --command=pnpm
          --args="${MIGRATION_COMMAND}"
          --quiet

      - name: Execute and wait for the migration job
        run: >-
          gcloud run jobs execute "eqplus-db-migrate-${{ inputs.environment }}"
          --project="${PROJECT_ID}"
          --region="${REGION}"
          --wait
          --format='yaml(metadata.name,status.conditions)'
          --quiet

  staging-deploy:
    # FR-FND-05: build once on develop, then promote this immutable image to prod.
    name: Build, push, and deploy staging API
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    env:
      CORS_ORIGINS: "http://localhost:3000,https://staging.plus.eqourse.com"
      MAILER_PROVIDER: "resend"
      OTP_EMAIL_FROM: ${{ vars.OTP_EMAIL_FROM }}
      SMS_PROVIDER: "sandbox"
      STORAGE_PROVIDER: "r2"
      R2_ENDPOINT: "https://50c49dfc680d966ef959aba266b04ea9.r2.cloudflarestorage.com"
      R2_BUCKET: "eqplus-staging-kyc-docs"
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate staging runtime configuration
        run: |
          if [ -z "${CORS_ORIGINS:-}" ]; then
            echo "::error::Missing required runtime configuration: CORS_ORIGINS"
            exit 1
          fi
          if [ -z "${OTP_EMAIL_FROM:-}" ]; then
            echo "::error::Missing required runtime configuration: OTP_EMAIL_FROM"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag "${IMAGE_URI}" .

      - name: Push API image
        run: docker push "${IMAGE_URI}"

      - name: Pin staging image by digest
        run: |
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE_URI}" --project="${PROJECT_ID}" --format='value(image_summary.digest)')"
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Built image has no valid digest"
            exit 1
          fi
          echo "STAGED_IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}@${DIGEST}" >> "${GITHUB_ENV}"

      # Route all egress through the VPC so Atlas sees the NAT's static address.
      # Unsuffixed secret names are PRODUCTION. Every non-production environment
      # must use an explicitly suffixed secret. Keep comments outside the folded
      # command below: a '#' inside it comments out every flag that follows.
      # The semicolon delimiter preserves the CORS comma and the sender's @ sign.
      - name: Deploy staging API
        run: >-
          gcloud run deploy eqplus-api-staging
          --project=eqplus-503212
          --region=asia-south1
          --image="${STAGED_IMAGE}"
          --service-account="${STAGING_RUNTIME_SERVICE_ACCOUNT}"
          --port=8080
          --min-instances=0
          --allow-unauthenticated
          --network=default
          --subnet=default
          --vpc-egress=all-traffic
          --set-env-vars="^;^CORS_ORIGINS=${CORS_ORIGINS};MAILER_PROVIDER=${MAILER_PROVIDER};OTP_EMAIL_FROM=${OTP_EMAIL_FROM};SMS_PROVIDER=${SMS_PROVIDER};STORAGE_PROVIDER=${STORAGE_PROVIDER};R2_ENDPOINT=${R2_ENDPOINT};R2_BUCKET=${R2_BUCKET}"
          --set-secrets=MONGODB_URI=MONGODB_URI_STAGING:latest,JWT_SECRET=JWT_SECRET_STAGING:latest,VENDOR_IDENTIFIER_HMAC_SECRET=VENDOR_IDENTIFIER_HMAC_SECRET:latest,CLIENT_IDENTIFIER_HMAC_SECRET=CLIENT_IDENTIFIER_HMAC_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest
          --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=2,periodSeconds=5,failureThreshold=12
          --liveness-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=10,timeoutSeconds=2,periodSeconds=30,failureThreshold=3
          --quiet

      - name: Configure optional staging Sentry DSN
        if: ${{ vars.ENABLE_SENTRY_DSN_SECRET == 'true' }}
        run: >-
          gcloud run services update eqplus-api-staging
          --project=eqplus-503212
          --region=asia-south1
          --update-secrets=SENTRY_DSN=SENTRY_DSN:latest
          --quiet

      - name: Verify staging health
        run: |
          SERVICE_URL="$(gcloud run services describe eqplus-api-staging --project=eqplus-503212 --region=asia-south1 --format='value(status.url)')"
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 "${SERVICE_URL}/health"

  production-deploy:
    name: Deploy production API
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CORS_ORIGINS: "https://plus.eqourse.com"
      MAILER_PROVIDER: "resend"
      OTP_EMAIL_FROM: ${{ vars.OTP_EMAIL_FROM }}
      SMS_PROVIDER: "sandbox"
      STORAGE_PROVIDER: "r2"
      R2_ENDPOINT: "https://50c49dfc680d966ef959aba266b04ea9.r2.cloudflarestorage.com"
      R2_BUCKET: "eqplus-prod-kyc-docs"
    permissions:
      contents: write
      actions: read
      id-token: write

    steps:
      - name: Validate production runtime configuration
        run: |
          if [ -z "${CORS_ORIGINS:-}" ]; then
            echo "::error::Missing required runtime configuration: CORS_ORIGINS"
            exit 1
          fi
          if [ -z "${OTP_EMAIL_FROM:-}" ]; then
            echo "::error::Missing required runtime configuration: OTP_EMAIL_FROM"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate staged develop commit
        run: |
          PARENTS="$(git rev-list --parents -n 1 HEAD)"
          if [ "$(wc -w <<< "${PARENTS}")" -ne 3 ]; then
            echo "::error::Production requires a two-parent develop-to-main merge commit"
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD^2)"
          if [ "${SOURCE_SHA}" != "$(git rev-parse origin/develop)" ]; then
            echo "::error::Merge second parent is not the current develop tip"
            exit 1
          fi
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "${GITHUB_ENV}"

      - name: Verify source commit passed staging deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_IDS="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" -f branch=develop -f head_sha="${SOURCE_SHA}" -f event=push -f status=success --jq '.workflow_runs[].id')"
          VERIFIED=false
          for RUN_ID in ${RUN_IDS}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name == "Build, push, and deploy staging API" and .conclusion == "success") | .id' | grep -q .; then
              VERIFIED=true
              break
            fi
          done
          if [ "${VERIFIED}" != true ]; then
            echo "::error::No successful staging deployment found for ${SOURCE_SHA}"
            exit 1
          fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve exact staged image digest
        run: |
          IMAGE_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}"
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE_BASE}:${SOURCE_SHA}" --project="${PROJECT_ID}" --format='value(image_summary.digest)')"
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Staged image is missing or has an invalid digest"
            exit 1
          fi
          PROMOTED_IMAGE="${IMAGE_BASE}@${DIGEST}"
          STAGING_REVISION="$(gcloud run services describe eqplus-api-staging --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.latestReadyRevisionName)')"
          STAGING_DIGEST="$(gcloud run revisions describe "${STAGING_REVISION}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.imageDigest)')"
          if [ "${STAGING_DIGEST}" != "${PROMOTED_IMAGE}" ] && [ "${STAGING_DIGEST}" != "${DIGEST}" ]; then
            echo "::error::Staging is not running the image selected for promotion"
            exit 1
          fi
          echo "PROMOTED_IMAGE=${PROMOTED_IMAGE}" >> "${GITHUB_ENV}"

      # Route all egress through the VPC so Atlas sees the NAT's static address.
      # Unsuffixed secret names are PRODUCTION and belong only to this job. Keep
      # comments outside the folded command below: a '#' inside it comments out
      # every flag that follows.
      - name: Deploy approved image to production
        run: >-
          gcloud run deploy eqplus-api
          --project=eqplus-503212
          --region=asia-south1
          --image="${PROMOTED_IMAGE}"
          --service-account="${PRODUCTION_RUNTIME_SERVICE_ACCOUNT}"
          --port=8080
          --min-instances=0
          --allow-unauthenticated
          --network=default
          --subnet=default
          --vpc-egress=all-traffic
          --set-env-vars=CORS_ORIGINS="${CORS_ORIGINS}",MAILER_PROVIDER="${MAILER_PROVIDER}",OTP_EMAIL_FROM="${OTP_EMAIL_FROM}",SMS_PROVIDER="${SMS_PROVIDER}",STORAGE_PROVIDER="${STORAGE_PROVIDER}",R2_ENDPOINT="${R2_ENDPOINT}",R2_BUCKET="${R2_BUCKET}"
          --set-secrets=MONGODB_URI=MONGODB_URI:latest,JWT_SECRET=JWT_SECRET:latest,VENDOR_IDENTIFIER_HMAC_SECRET=VENDOR_IDENTIFIER_HMAC_SECRET:latest,CLIENT_IDENTIFIER_HMAC_SECRET=CLIENT_IDENTIFIER_HMAC_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest
          --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=2,periodSeconds=5,failureThreshold=12
          --liveness-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=10,timeoutSeconds=2,periodSeconds=30,failureThreshold=3
          --quiet

      - name: Configure optional production Sentry DSN
        if: ${{ vars.ENABLE_SENTRY_DSN_SECRET == 'true' }}
        run: >-
          gcloud run services update eqplus-api
          --project=eqplus-503212
          --region=asia-south1
          --update-secrets=SENTRY_DSN=SENTRY_DSN:latest
          --quiet

      - name: Verify production health
        run: |
          SERVICE_URL="$(gcloud run services describe eqplus-api --project=eqplus-503212 --region=asia-south1 --format='value(status.url)')"
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 "${SERVICE_URL}/health"

      - name: Tag production release
        run: |
          TAG="$(date -u +prod-%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${GITHUB_SHA}" -m "Production release ${TAG}; image source ${SOURCE_SHA}; image ${PROMOTED_IMAGE}"
          git push origin "refs/tags/${TAG}"
