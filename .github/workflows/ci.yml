name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - '**.md'

permissions:
  contents: read

env:
  PROJECT_ID: eqplus-503212
  REGION: asia-south1
  ARTIFACT_REPOSITORY: eqplus-api
  IMAGE_NAME: eqplus-api
  IMAGE_URI: asia-south1-docker.pkg.dev/eqplus-503212/eqplus-api/eqplus-api:${{ github.sha }}
  RUNTIME_SERVICE_ACCOUNT: eqplus-api-runtime@eqplus-503212.iam.gserviceaccount.com

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore MongoDB memory-server binary cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: ${{ runner.os }}-mongodb-memory-server-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/node_modules/.cache/mongodb-memory-server

      - name: Lint
        run: pnpm lint

      - name: Test without external services
        run: pnpm test
        env:
          MONGOMS_RUNTIME_DOWNLOAD: "false"

      - name: Build
        run: pnpm build

  preview-config:
    # FR-FND-05: keep one exact preview origin bound to the staging API.
    name: Configure stable Vercel preview
    needs: ci
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      STAGING_API_URL: "https://eqplus-api-staging-48495065742.asia-south1.run.app"
      PREVIEW_ORIGIN: "https://preview.plus.eqourse.com"
      PREVIEW_BRANCH: ${{ github.head_ref }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Validate Vercel preview configuration
        run: |
          for name in STAGING_API_URL PREVIEW_ORIGIN PREVIEW_BRANCH VERCEL_PROJECT_ID VERCEL_TEAM_ID VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required preview configuration: ${name}"
              exit 1
            fi
          done

      - name: Sync Preview variables and stable branch domain
        run: |
          node --input-type=module <<'NODE'
          const required = (name) => {
            const value = process.env[name]?.trim();
            if (!value) throw new Error(`Missing ${name}`);
            return value;
          };

          const token = required("VERCEL_TOKEN");
          const projectId = required("VERCEL_PROJECT_ID");
          const teamId = required("VERCEL_TEAM_ID");
          const stagingApiUrl = required("STAGING_API_URL");
          const previewOrigin = required("PREVIEW_ORIGIN");
          const previewBranch = required("PREVIEW_BRANCH");
          const query = `teamId=${encodeURIComponent(teamId)}`;

          async function vercelRequest(path, method, body) {
            const response = await fetch(`https://api.vercel.com${path}${path.includes("?") ? "&" : "?"}${query}`, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(body),
            });
            if (!response.ok) {
              const detail = await response.text();
              throw new Error(`Vercel ${method} ${path} failed (${response.status}): ${detail}`);
            }
          }

          await vercelRequest(
            `/v10/projects/${encodeURIComponent(projectId)}/env?upsert=true`,
            "POST",
            [
              { key: "NEXT_PUBLIC_API_URL", value: stagingApiUrl, type: "plain", target: ["preview"] },
              { key: "API_URL", value: stagingApiUrl, type: "plain", target: ["preview"] },
              { key: "APP_URL", value: previewOrigin, type: "plain", target: ["preview"] },
            ],
          );
          await vercelRequest(
            `/v9/projects/${encodeURIComponent(projectId)}/domains/${encodeURIComponent(new URL(previewOrigin).hostname)}`,
            "PATCH",
            { gitBranch: previewBranch },
          );
          NODE

  staging-deploy:
    # FR-FND-05: build once on main, then promote this immutable image to prod.
    name: Build, push, and deploy staging API
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      CORS_ORIGINS: "http://localhost:3000,https://preview.plus.eqourse.com"
      MAILER_PROVIDER: "sandbox"
      SMS_PROVIDER: "sandbox"
      STORAGE_PROVIDER: "r2"
      R2_ENDPOINT: "https://50c49dfc680d966ef959aba266b04ea9.r2.cloudflarestorage.com"
      R2_BUCKET: "eqplus-staging-kyc-docs"
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate staging runtime configuration
        run: |
          if [ -z "${CORS_ORIGINS:-}" ]; then
            echo "::error::Missing required runtime configuration: CORS_ORIGINS"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag "${IMAGE_URI}" .

      - name: Push API image
        run: docker push "${IMAGE_URI}"

      # Route all egress through the VPC so Atlas sees the NAT's static address.
      - name: Deploy staging API
        run: >-
          gcloud run deploy eqplus-api-staging
          --project=eqplus-503212
          --region=asia-south1
          --image="${IMAGE_URI}"
          --service-account="${RUNTIME_SERVICE_ACCOUNT}"
          --port=8080
          --min-instances=0
          --allow-unauthenticated
          --network=default
          --subnet=default
          --vpc-egress=all-traffic
          --set-env-vars=CORS_ORIGINS="${CORS_ORIGINS}",MAILER_PROVIDER="${MAILER_PROVIDER}",SMS_PROVIDER="${SMS_PROVIDER}",STORAGE_PROVIDER="${STORAGE_PROVIDER}",R2_ENDPOINT="${R2_ENDPOINT}",R2_BUCKET="${R2_BUCKET}"
          --set-secrets=MONGODB_URI=MONGODB_URI:latest,JWT_SECRET=JWT_SECRET:latest,VENDOR_IDENTIFIER_HMAC_SECRET=VENDOR_IDENTIFIER_HMAC_SECRET:latest,CLIENT_IDENTIFIER_HMAC_SECRET=CLIENT_IDENTIFIER_HMAC_SECRET:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest
          --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=2,periodSeconds=5,failureThreshold=12
          --liveness-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=10,timeoutSeconds=2,periodSeconds=30,failureThreshold=3
          --quiet

      - name: Configure optional staging Sentry DSN
        if: ${{ vars.ENABLE_SENTRY_DSN_SECRET == 'true' }}
        run: >-
          gcloud run services update eqplus-api-staging
          --project=eqplus-503212
          --region=asia-south1
          --update-secrets=SENTRY_DSN=SENTRY_DSN:latest
          --quiet

      - name: Verify staging health
        run: |
          SERVICE_URL="$(gcloud run services describe eqplus-api-staging --project=eqplus-503212 --region=asia-south1 --format='value(status.url)')"
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 "${SERVICE_URL}/health"

  production-deploy:
    name: Deploy production API
    needs: staging-deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CORS_ORIGINS: "https://plus.eqourse.com"
      MAILER_PROVIDER: "resend"
      OTP_EMAIL_FROM: ${{ vars.OTP_EMAIL_FROM }}
      SMS_PROVIDER: "sandbox"
      STORAGE_PROVIDER: "r2"
      R2_ENDPOINT: "https://50c49dfc680d966ef959aba266b04ea9.r2.cloudflarestorage.com"
      R2_BUCKET: "eqplus-prod-kyc-docs"
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate production runtime configuration
        run: |
          if [ -z "${CORS_ORIGINS:-}" ]; then
            echo "::error::Missing required runtime configuration: CORS_ORIGINS"
            exit 1
          fi
          if [ -z "${OTP_EMAIL_FROM:-}" ]; then
            echo "::error::Missing required runtime configuration: OTP_EMAIL_FROM"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # Route all egress through the VPC so Atlas sees the NAT's static address.
      - name: Deploy approved image to production
        run: >-
          gcloud run deploy eqplus-api
          --project=eqplus-503212
          --region=asia-south1
          --image="${IMAGE_URI}"
          --service-account="${RUNTIME_SERVICE_ACCOUNT}"
          --port=8080
          --min-instances=0
          --allow-unauthenticated
          --network=default
          --subnet=default
          --vpc-egress=all-traffic
          --set-env-vars=CORS_ORIGINS="${CORS_ORIGINS}",MAILER_PROVIDER="${MAILER_PROVIDER}",OTP_EMAIL_FROM="${OTP_EMAIL_FROM}",SMS_PROVIDER="${SMS_PROVIDER}",STORAGE_PROVIDER="${STORAGE_PROVIDER}",R2_ENDPOINT="${R2_ENDPOINT}",R2_BUCKET="${R2_BUCKET}"
          --set-secrets=MONGODB_URI=MONGODB_URI:latest,JWT_SECRET=JWT_SECRET:latest,VENDOR_IDENTIFIER_HMAC_SECRET=VENDOR_IDENTIFIER_HMAC_SECRET:latest,CLIENT_IDENTIFIER_HMAC_SECRET=CLIENT_IDENTIFIER_HMAC_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest
          --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=2,periodSeconds=5,failureThreshold=12
          --liveness-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=10,timeoutSeconds=2,periodSeconds=30,failureThreshold=3
          --quiet

      - name: Configure optional production Sentry DSN
        if: ${{ vars.ENABLE_SENTRY_DSN_SECRET == 'true' }}
        run: >-
          gcloud run services update eqplus-api
          --project=eqplus-503212
          --region=asia-south1
          --update-secrets=SENTRY_DSN=SENTRY_DSN:latest
          --quiet

      - name: Verify production health
        run: |
          SERVICE_URL="$(gcloud run services describe eqplus-api --project=eqplus-503212 --region=asia-south1 --format='value(status.url)')"
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 "${SERVICE_URL}/health"
